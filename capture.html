<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self';" />
    <title>Quick note</title>
    <link rel="stylesheet" href="/src/renderer/styles.css" />
  </head>
  <body class="capture">
    <div class="capture-box">
      <div class="capture-head drag">
        <span class="u">Quick note</span>
        <span class="u capture-hint"><kbd>Enter</kbd> adds it to Inbox · <kbd>Shift</kbd> <kbd>Enter</kbd> new line · <kbd>Esc</kbd> closes</span>
      </div>
      <textarea id="capture-text" class="capture-text no-drag" placeholder="Write it down…" spellcheck="true" aria-label="Quick note" rows="3"></textarea>
      <div class="capture-foot no-drag">
        <span id="capture-status" class="u capture-status"></span>
        <button id="capture-send" class="pill u capture-send" type="button">Add to Inbox</button>
      </div>
    </div>
    <script type="module" src="/src/renderer/capture.ts"></script>
  </body>
</html>
